name: validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify each SKILL.md has required frontmatter
        run: |
          set -e
          missing=0
          for f in skills/*/SKILL.md; do
            echo "Checking $f"
            if ! grep -q '^name:' "$f"; then
              echo "  ❌ missing 'name' field"
              missing=1
            fi
            if ! grep -q '^description:' "$f"; then
              echo "  ❌ missing 'description' field"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Some SKILL.md files are missing required frontmatter."
            exit 1
          fi
          echo "✅ All SKILL.md frontmatter OK"

      - name: Verify Codex skill metadata constraints
        run: |
          set -e
          python3 -m pip install --quiet PyYAML
          python3 <<'PY'
          import pathlib
          import sys
          import yaml

          allowed = {"name", "description"}
          failed = False

          for path in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  print(f"❌ {path}: missing opening frontmatter delimiter")
                  failed = True
                  continue

              parts = text.split("---", 2)
              if len(parts) < 3:
                  print(f"❌ {path}: missing closing frontmatter delimiter")
                  failed = True
                  continue

              try:
                  metadata = yaml.safe_load(parts[1]) or {}
              except yaml.YAMLError as exc:
                  print(f"❌ {path}: invalid YAML frontmatter: {exc}")
                  failed = True
                  continue

              missing = sorted(allowed - metadata.keys())
              extra = sorted(metadata.keys() - allowed)
              description = str(metadata.get("description", ""))

              if missing:
                  print(f"❌ {path}: missing required fields: {', '.join(missing)}")
                  failed = True
              if extra:
                  print(f"❌ {path}: unsupported frontmatter fields: {', '.join(extra)}")
                  failed = True
              if len(description) > 1024:
                  print(f"❌ {path}: description is {len(description)} chars, max 1024 for Codex")
                  failed = True
              if "\n## Trigger routing\n" not in parts[2]:
                  print(f"❌ {path}: missing '## Trigger routing' section")
                  failed = True

              if not (missing or extra or len(description) > 1024):
                  print(f"✓ {path}: description {len(description)} chars")

          if failed:
              sys.exit(1)

          print("✅ Codex skill metadata constraints OK")
          PY

      - name: Verify dev-baseline copies are in sync
        run: |
          set -e
          canonical_md5=$(md5sum references/dev-baseline.md | cut -d' ' -f1)
          echo "Canonical: $canonical_md5"
          drift=0
          for f in skills/*/references/dev-baseline.md; do
            copy_md5=$(md5sum "$f" | cut -d' ' -f1)
            if [ "$copy_md5" != "$canonical_md5" ]; then
              echo "❌ $f drifted from canonical (md5=$copy_md5)"
              drift=1
            else
              echo "✓ $f"
            fi
          done
          if [ "$drift" -ne 0 ]; then
            echo "Re-sync via: cp references/dev-baseline.md skills/<skill>/references/dev-baseline.md"
            exit 1
          fi
          echo "✅ All baseline copies in sync"

      - name: Verify .claude-plugin manifests are valid JSON
        run: |
          set -e
          if [ ! -f .claude-plugin/marketplace.json ]; then
            echo "❌ .claude-plugin/marketplace.json missing (needed for /plugin marketplace add)"
            exit 1
          fi
          if [ ! -f .claude-plugin/plugin.json ]; then
            echo "❌ .claude-plugin/plugin.json missing (needed for /plugin install)"
            exit 1
          fi
          # Parse both files; fail if not valid JSON
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))" || (echo "❌ marketplace.json is not valid JSON" && exit 1)
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))" || (echo "❌ plugin.json is not valid JSON" && exit 1)
          echo "✅ Both .claude-plugin manifests are valid JSON"

      - name: Verify marketplace.json structure (Claude Code schema)
        run: |
          set -e
          python3 <<'PY'
          import json, sys
          m = json.load(open('.claude-plugin/marketplace.json'))
          errors = []
          if 'name' not in m: errors.append("missing top-level 'name'")
          if 'owner' not in m or not isinstance(m.get('owner'), dict) or 'name' not in m['owner']:
              errors.append("missing top-level 'owner.name'")
          if 'plugins' not in m or not isinstance(m.get('plugins'), list) or not m['plugins']:
              errors.append("missing or empty 'plugins' array")
          for i, p in enumerate(m.get('plugins', [])):
              if 'name' not in p: errors.append(f"plugins[{i}] missing 'name'")
              if 'source' not in p: errors.append(f"plugins[{i}] missing 'source'")
          if errors:
              for e in errors: print(f"❌ {e}")
              sys.exit(1)
          print("✅ marketplace.json structure OK")
          PY

      - name: Verify expected skill directories exist
        run: |
          set -e
          missing=0
          for skill in dev-code-review dev-commit-writer dev-spec dev-plan dev-fix dev-workflow; do
            if [ ! -f "skills/$skill/SKILL.md" ]; then
              echo "❌ skills/$skill/SKILL.md missing"
              missing=1
            else
              echo "✓ skills/$skill"
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "✅ All 6 expected skills present"

      - name: Verify CLAUDE.md.template exists (not CLAUDE.md)
        run: |
          if [ -f CLAUDE.md ]; then
            echo "❌ CLAUDE.md should not exist at repo root — use CLAUDE.md.template instead"
            exit 1
          fi
          if [ ! -f CLAUDE.md.template ]; then
            echo "❌ CLAUDE.md.template missing"
            exit 1
          fi
          echo "✅ CLAUDE.md.template present, no live CLAUDE.md polluting repo root"
